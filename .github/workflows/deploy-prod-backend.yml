name: Deploy Backend to PROD (mohaffez-ba2ec)

# Deploys Firestore rules, indexes, Storage rules, and Cloud Functions to PROD.
# Web hosting is handled by web_deploy.yml (path-filtered).
# This workflow requires MANUAL APPROVAL via the `production` environment.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'functions/**'
      - '.github/workflows/deploy-prod-backend.yml'
  workflow_dispatch: {}

env:
  PROJECT_ID: 'mohaffez-ba2ec'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The `production` environment must require manual approval in repo settings:
    # GitHub repo -> Settings -> Environments -> production -> Required reviewers
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules + indexes + Storage rules + Functions
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage,functions \
            --project=${{ env.PROJECT_ID }} \
            --non-interactive
