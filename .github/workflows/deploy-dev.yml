name: Deploy to DEV (mohaffez-dev)

# Auto-deploys backend (Firestore rules, indexes, Cloud Functions) to the
# DEV Firebase project whenever the `develop` branch is updated.
# Web is hosted on Hostinger — not deployed here.
# Mobile builds are NOT deployed here — they ship via Play Store separately.

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

env:
  PROJECT_ID: 'mohaffez-dev'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore indexes + Functions
        run: |
          firebase deploy \
            --only firestore:indexes,functions \
            --project=${{ env.PROJECT_ID }} \
            --non-interactive

