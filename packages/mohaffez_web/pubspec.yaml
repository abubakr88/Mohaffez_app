name: mohaffez_web
description: Mohaffez web application - mohafezy.com
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core shared package
  mohaffez_core:
    path: ../mohaffez_core

  # State management
  flutter_riverpod: ^2.4.9

  # Routing
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.2
  firebase_analytics: ^11.3.5

  # Error tracking
  sentry_flutter: ^8.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.0

  # Charts (admin metrics)
  fl_chart: ^0.69.0

  # Cloud Functions (admin actions / metrics refresh)
  cloud_functions: ^5.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
