name: mohaffez_finder_app
description: "Find and learn from Quran teachers near you."
publish_to: 'none'

version: 1.0.6+24

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core shared package
  mohaffez_core:
    path: ../mohaffez_core

  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core packages
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0
  cupertino_icons: ^1.0.8

  # Quran data
  quran: 1.3.1
  # Kept as a runtime dependency because this version exposes native plugin
  # metadata; excluding it from release Gradle inputs breaks registrant builds.
  flutter_native_splash: ^2.4.1

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # Payment
  webview_flutter: ^4.4.2

  # Storage & Cache
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.2
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.0
  firebase_app_check: ^0.3.2+5
  cloud_functions: ^5.1.4  # ← ADD THIS if not present

  # Code Generation - Required at runtime
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Maps and Location (free, OSM-based)
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Network & Connectivity
  connectivity_plus: ^6.0.5
  http: ^1.2.0
  crypto: ^3.0.3

  share_plus: ^7.2.1
  permission_handler: ^11.0.1
  path_provider: ^2.1.1

  # UI & Fonts
  google_fonts: ^6.2.1

  # Cache
  flutter_cache_manager: ^3.3.1

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.0.0  # Web-compatible file picking
  image_cropper: ^10.0.0+1  # Native edge-to-edge support on Android 15+

  # Image Processing
  flutter_image_compress: ^2.1.0
  path: ^1.8.3
  image: ^4.1.3

  intl: ^0.20.0
  timeago: ^3.6.1

  
  table_calendar: ^3.0.9

  # Quiz celebrations
  confetti: ^0.8.0

  # Reward / quiz sound effects (clapping, try-again, level-up…)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation tools - UPDATED TO LATEST
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # # Riverpod code generation - UPDATED // COmment out for now to avoid build issues, can re-enable once we have the basics working
  custom_lint: ^0.7.3
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.6.2

  # Icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # ADD THESE FONTS
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.otf

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
          
  assets:
    - assets/images/icon.png
    - assets/images/mastercard.png
    - assets/images/visa.png
    - assets/quran_data.json
    - assets/quran_challenge/
    - assets/sounds/
    - assets/badges/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"   # clean white to match icon bg
  adaptive_icon_foreground: "assets/images/Icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B4A4A"  # AppThemeConstants.deepTeal
  image: assets/images/icon.png
  color_dark: "#0B4A4A"
  image_dark: assets/images/icon.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  web: false

dependency_overrides:
  analyzer_plugin: ^0.13.0
