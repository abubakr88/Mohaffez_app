name: mohaffez_core
description: Core shared package for Mohaffez (models, repositories, providers, services)
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.2
  cloud_functions: ^5.1.4
  firebase_storage: ^12.3.0
  firebase_app_check: ^0.3.2+5

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^14.6.2

  # Code Generation - Required at runtime
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.0
  timeago: ^3.6.1
  crypto: ^3.0.3
  http: ^1.2.0

  # Cache
  flutter_cache_manager: ^3.3.1

  # Network
  connectivity_plus: ^6.0.5

  # Cache & Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation tools
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

dependency_overrides:
  analyzer_plugin: ^0.13.0
