name: mohaffez_finder_app
description: "Find and learn from Quran teachers near you."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Core packages
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  provider: ^6.1.1

  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # Storage & Cache
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Routing
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.2
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.0

  # Code Generation - Required at runtime
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Maps and Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_google_maps_webservices: ^1.1.1

  # Network & Connectivity
  connectivity_plus: ^6.0.5
  http: ^1.2.0

  share_plus: ^7.2.1
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  dio: ^5.4.0

  # UI & Fonts
  google_fonts: ^6.2.1

  # Media
  image_picker: ^1.1.2
  
  # Image Processing
  flutter_image_compress: ^2.1.0
  path: ^1.8.3
  image: ^4.1.3

  intl: ^0.20.0
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code generation tools
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  
  # Riverpod code generation
  custom_lint: ^0.7.3
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13

  # Icons
  flutter_launcher_icons: ^0.13.1

# ✅ FIX: Override incompatible analyzer_plugin version
dependency_overrides:
  analyzer_plugin: ^0.13.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#A67C52"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
