name: mohaffez_finder_app
description: "Find and learn from Quran teachers near you."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Core packages
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0

  # State Management
  flutter_riverpod: ^2.4.9
  provider: ^6.1.1

  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # Storage & Cache
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.2
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Maps and Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  geoflutterfire_plus: ^0.0.32
  flutter_google_maps_webservices: ^1.1.1

  # Network & Connectivity
  connectivity_plus: ^6.0.5
  http: ^1.2.0

  # UI & Fonts
  google_fonts: ^6.2.1

  # Media
  image_picker: ^1.1.2

  # Note: intl is provided by flutter_localizations, no need to add it explicitly

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1

  # Linting
  flutter_lints: ^4.0.0

  # Icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#A67C52"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
